# Blueprint de Render para el backend de EduTrack.
# En render.com: New + → Blueprint → conectar este repo → detecta este archivo.
# Las variables marcadas con sync:false se piden al crear el servicio (secretos).
services:
  - type: web
    name: edutrack-api
    runtime: node
    plan: free
    rootDir: Backend-Diagnostico-vocacional
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      # Respaldos de proveedores distintos: los ":free" de un mismo proveedor se
      # saturan (429) a la vez. Si aparecen 404 "unavailable for free" en los
      # logs, el slug fue retirado y hay que actualizar esta lista.
      - key: OPENROUTER_FALLBACK_MODELS
        value: google/gemma-4-31b-it:free,nvidia/nemotron-3-super-120b-a12b:free,z-ai/glm-5.2:free,nvidia/nemotron-3-nano-30b-a3b:free,nvidia/nemotron-nano-9b-v2:free
      - key: FRONTEND_URL
        sync: false
